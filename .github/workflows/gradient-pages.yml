# Publishes Gradient as an installable, offline-capable web app on GitHub Pages.
# One-time setup: repository Settings → Pages → Source: "GitHub Actions".
name: Gradient web app
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['applied-math-course/**']
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test and build
        working-directory: applied-math-course
        run: |
          node tests/run.mjs
          node tools/build.mjs
          mkdir -p ../site
          node tools/bundle.mjs
          cp -r index.html Gradient.html manifest.webmanifest sw.js css js vendor icons ../site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
