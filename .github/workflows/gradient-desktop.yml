# Builds the Gradient desktop installers for macOS, Windows and Linux.
# Run it from the Actions tab ("Run workflow"), or push a tag like v1.0.0.
# The installers appear as downloadable artifacts on the run's summary page.
name: Gradient desktop installers
on:
  workflow_dispatch:
  push:
    tags: ['v*']
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: applied-math-course
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: applied-math-course/package-lock.json
      - run: npm ci
      - run: node tests/run.mjs
      - run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: gradient-${{ matrix.os }}
          path: |
            applied-math-course/release/*.dmg
            applied-math-course/release/*.exe
            applied-math-course/release/*.AppImage
            applied-math-course/release/*.deb
          if-no-files-found: error
